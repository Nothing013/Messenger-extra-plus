org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 8.13.2 is tested up to API 36; the API 37 platform still builds, which
# keeps us on AGP 8.x instead of migrating to AGP 9. Match the "37.0" platform
# string, since that is what AGP compares against.
android.suppressUnsupportedCompileSdk=37.0
